<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Hors Ligne | Les Génies d'Afrique</title>
  <meta name="theme-color" content="#1A3A8F">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #f0f4ff 0%, #ffffff 100%);
      color: #1A202C;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(26, 58, 143, 0.12);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      background: #fff8ee;
      border: 1px solid #fed7aa;
      border-radius: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      color: #D32F2F;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1A3A8F;
      margin-bottom: 0.75rem;
    }
    p {
      color: #4A5568;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #1A3A8F;
      color: #ffffff;
      font-weight: 600;
      padding: 0.85rem 1.5rem;
      border-radius: 0.75rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #0D1F6B; }
    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #a0aec0;
      border-top: 1px solid #edf2f7;
      padding-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      Il semble que votre connexion Internet soit interrompue. Les pages que vous avez déjà consultées restent accessibles.
    </p>
    <button class="btn" onclick="window.location.reload()">Réessayer la connexion</button>
    <div class="footer-note">
      Complexe Scolaire Bilingue Les Génies d'Afrique
    </div>
  </div>
</body>
</html>
